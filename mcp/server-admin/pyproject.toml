[project]
name = "discord-mcp"
version = "0.1.0"
description = "Discord サーバー管理用 MCP サーバー"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.27.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_mcp"]
